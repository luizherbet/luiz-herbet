<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d9e4ec" />
  <base href="/game/" />
  <title>Músculo liso — etapas</title>
  <link rel="stylesheet" href="/game/style.css?v=steps1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app" class="screen">
    <header class="sim-bar">
      <div class="sim-bar-title">
        <span>Músculo liso</span>
        <strong id="step-title">Célula fusiforme</strong>
      </div>
      <div class="sim-bar-meta">
        <span id="step-badge">1 / 5</span>
      </div>
    </header>

    <div class="build-grid">
      <section class="stage-wrap">
        <div id="stage" class="stage">
          <canvas id="cell" width="960" height="560"></canvas>
          <div id="slots" class="slots"></div>
        </div>
      </section>

      <aside class="tray-panel">
        <div class="lesson-top">
          <span id="phase-tag" class="phase-tag">Forma</span>
          <span id="step-count">Etapa 1</span>
        </div>
        <div class="progress"><i id="progress-fill"></i></div>
        <h2 id="prompt-title">Qual a forma desta célula?</h2>
        <p id="prompt-body">Observe a célula já com núcleo e organelas. Digite o formato característico.</p>

        <div id="text-block" class="answer-block">
          <input id="text-input" class="text-input" type="text" autocomplete="off" spellcheck="false" placeholder="Digite aqui…" />
          <button type="button" id="btn-check" class="btn primary">Verificar</button>
          <p id="text-feedback" class="feedback"></p>
        </div>

        <div id="quiz-block" class="answer-block hidden">
          <div id="quiz-list" class="quiz-list"></div>
          <p id="quiz-feedback" class="feedback"></p>
        </div>

        <div id="drag-block" class="answer-block hidden">
          <p class="tray-help" id="drag-help">Arraste o elemento até o encaixe marcado.</p>
          <div id="tray" class="tray"></div>
          <p id="drag-feedback" class="feedback"></p>
        </div>

        <div class="actions">
          <button type="button" id="btn-next" class="btn primary" disabled>Próxima</button>
        </div>
      </aside>
    </div>
  </div>

  <div id="ghost" class="ghost hidden" aria-hidden="true"></div>
  <script src="/game/game.js?v=steps1"></script>
</body>
</html>
