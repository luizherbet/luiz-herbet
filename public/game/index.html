<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d9e4ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Contração Muscular — Guia Didático</title>
  <base href="/game/" />
  <link rel="stylesheet" href="/game/style.css?v=fit3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="chooser" class="screen">
    <div class="chooser-inner">
      <p class="eyebrow">Ross &amp; Pawlina · Histologia (2016)</p>
      <h1>Como o músculo se contrai?</h1>
      <p class="lede">Escolha o tipo. Guia curto, figura grande, etapa a etapa.</p>
      <div class="choice-grid">
        <button type="button" id="pick-smooth" class="choice-card">
          <strong>Músculo liso</strong>
          <span>Fusiforme · cavéolas + REL · CaM–MLCK</span>
        </button>
        <button type="button" id="pick-striated" class="choice-card">
          <strong>Estriado esquelético</strong>
          <span>Sarcômero · tríade · troponina</span>
        </button>
      </div>
    </div>
  </div>

  <div id="sim" class="screen hidden">
    <header class="sim-bar">
      <button type="button" id="btn-home" class="btn-link">← Tipos</button>
      <div class="sim-bar-title">
        <span id="sim-eyebrow"></span>
        <strong id="sim-title"></strong>
      </div>
      <div class="sim-bar-meta">
        <span id="state-badge">Relaxada</span>
        <span id="length-readout">—</span>
      </div>
    </header>

    <div class="sim-grid">
      <section class="viewport">
        <canvas id="cell" width="960" height="560"></canvas>
      </section>

      <aside class="lesson">
        <div class="lesson-top">
          <span id="phase-tag" class="phase-tag"></span>
          <span id="step-count"></span>
        </div>
        <div class="progress"><i id="progress-fill"></i></div>
        <h2 id="step-title"></h2>
        <p id="step-body"></p>
        <div class="observe-box">
          <strong>Na figura</strong>
          <p id="step-observe"></p>
        </div>
        <div class="contrast-box" id="contrast-box">
          <strong>vs outro tipo</strong>
          <p id="step-contrast"></p>
        </div>
        <ul id="step-keys" class="keypoints"></ul>
        <p id="step-source" class="source-line"></p>
        <div class="actions">
          <button type="button" id="btn-prev" class="btn ghost">Anterior</button>
          <button type="button" id="btn-next" class="btn primary">Próximo</button>
        </div>
      </aside>
    </div>
  </div>

  <script src="/game/game.js?v=fit3"></script>
</body>
</html>
