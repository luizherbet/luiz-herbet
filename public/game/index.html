<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d9e4ec" />
  <base href="/game/" />
  <title>Monte a Célula Lisa — Histologia</title>
  <link rel="stylesheet" href="/game/style.css?v=steps1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app" class="screen">
    <header class="top">
      <div class="top-copy">
        <p class="eyebrow">Ross &amp; Pawlina · Músculo liso</p>
        <h1 id="step-title">Monte a célula</h1>
      </div>
      <div class="top-meta">
        <span id="step-count">1 / 12</span>
        <button type="button" id="btn-restart" class="btn ghost compact">Recomeçar</button>
      </div>
    </header>

    <div class="layout">
      <section class="stage-wrap">
        <div id="stage" class="stage">
          <canvas id="cell" width="960" height="560"></canvas>
          <div id="slots" class="slots"></div>
          <div id="arrow" class="arrow hidden" aria-hidden="true"></div>
        </div>
      </section>

      <aside class="panel">
        <div class="progress"><i id="progress-fill"></i></div>
        <p id="phase" class="phase"></p>
        <h2 id="prompt"></h2>
        <p id="body" class="body"></p>

        <form id="text-form" class="text-form hidden" autocomplete="off">
          <label for="answer" id="answer-label">Sua resposta</label>
          <input id="answer" name="answer" type="text" enterkeyhint="done" />
          <button type="submit" class="btn primary">Conferir</button>
        </form>

        <div id="quiz" class="quiz hidden"></div>

        <div id="tray-wrap" class="tray-wrap hidden">
          <p class="tray-help">Arraste o elemento até o encaixe. O nome aparece só se estiver certo.</p>
          <div id="tray" class="tray"></div>
          <div id="pools" class="pools"></div>
        </div>

        <div id="feedback" class="feedback hidden"></div>
        <button type="button" id="btn-next" class="btn primary hidden">Próxima etapa</button>
      </aside>
    </div>
  </div>

  <div id="ghost" class="ghost hidden" aria-hidden="true"></div>
  <script src="/game/game.js?v=steps1"></script>
</body>
</html>
